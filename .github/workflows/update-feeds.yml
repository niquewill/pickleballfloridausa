name: Daily News & Tournament Feeds

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-content
  cancel-in-progress: false

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch feeds and rebuild live sections
        run: node scripts/update-feeds.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data index.html pages
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-update news & tournament feeds - $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi